# gw-link 联动规则 (对等互联)
# 格式: 规则名|触发网关(self|peer)|触发命令|目标网关(self|peer)|目标命令
# 触发命令和目标命令是 zigbeed 控制 JSON
#
# 示例: 本机网络开灯 -> 对端网络也开灯
# 客厅灯开|self|{"State":"1"}|peer|{"State":"1"}
# 客厅灯关|self|{"State":"0"}|peer|{"State":"0"}
#
# 示例: 对端网络开灯 -> 本机网络也开灯
# 卧室灯开|peer|{"State":"1"}|self|{"State":"1"}
# 卧室灯关|peer|{"State":"0"}|self|{"State":"0"}
